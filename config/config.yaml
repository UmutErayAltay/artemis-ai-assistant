# Artemis örnek konfigürasyonu.
# Burada tanımlanmayan alanlar için config/settings.py::Settings
# sınıfındaki varsayılanlar kullanılır.

ollama_model: "llama3.1"
# Not: `python main.py --chat` artık başlangıçta kurulu modelleri
# listeleyip interaktif seçim sunuyor (core/ollama_manager.py); bu alan
# yalnızca ileride eklenecek interaktif olmayan/otomasyon senaryoları
# için bir yedek (fallback) değerdir.

# True yaparsanız Ollama'nın native tools=[...] (function-calling) mekanizması
# denenir; modeliniz desteklemiyorsa otomatik olarak metin+şema tabanlı
# akışa düşülür (bkz. core/llm_client.py modül dokümantasyonu).
use_native_tool_calling: false

# Model, son kullanımdan bu süre sonra RAM'den otomatik boşaltılır.
# RAM kısıtlıysa (sesli asistan gibi arka planda uzun süre bekleyen
# kullanımlarda önerilir) "30s" veya "1m" gibi kısa bir değer kullanın.
# Aktif kullanımda hız öncelikliyse "5m"/"30m" gibi uzun tutun.
# "0" = her cevaptan hemen sonra boşalt, "-1" = hiç boşaltma.
ollama_keep_alive: "1m"

# Tool'ların kendi danger_level'i zaten temel korumayı sağlar; bu liste
# operasyonel olarak ek/geçici bir kısıtlama eklemek istendiğinde,
# kod değiştirmeden burada tool adı belirtmek için vardır.
dangerous_tools: []

# --- Sesli asistan ayarları ---
# `python scripts/setup_voice.py` model dosyalarını indirir; burada
# tanımlanmayan yollar için config/settings.py'deki repo-köküne-göre
# varsayılanlar (voice_models/...) kullanılır.

# Sesli asistan katmanının ana açma/kapama anahtarı. False yapılırsa
# mikrofon hiç açılmaz; Artemis yalnızca metin tabanlı çalışır.
voice_enabled: true

# Sürekli "Artemis" uyandırma sözcüğü dinlemesinin açma/kapama anahtarı.
# voice_enabled açıkken bunu false yaparsanız asistan yine kullanılabilir
# ama uyanmak için kısayol tuşu gerekir (bkz. ui/hotkey.py).
wake_word_enabled: true

# Uyandırma sözcüğü için kabul edilen telaffuz varyantları. "Artemis" özel
# bir isim olduğundan küçük Whisper "tiny" modeli onu "artemiz", "arte mis"
# gibi farklı dizilere çevirebilir. Konsol/log çıktısında kendi
# telaffuzunuz için modelin ne ürettiğini görüp buraya yeni bir varyant
# ekleyebilirsiniz.
wake_words:
  - "artemis"
  - "artemiz"
  - "arte mis"
  - "art emis"
  - "hartemis"

# Komut tanıma (STT) için faster-whisper modeli.
# Varsayılan "large-v3-turbo": GPU'da hem EN DOĞRU hem hızlı seçenek.
# Ölçüm (RTX 4050, aynı ses klipleri):
#     small (CPU)          1.35 sn -> "lobby of legends açar mısın"
#     large-v3-turbo (GPU) 0.33 sn -> "league of legends, açar mısın"
# GPU yoksa Artemis bunu otomatik olarak "small"a düşürür (büyük model
# CPU'da 10+ saniye sürer ve asistanı kullanılamaz yapar).
whisper_model_size: "large-v3-turbo"

# faster-whisper çıkarımının sayısal hassasiyeti. GPU'da "float16"
# önerilir (6GB VRAM için fazlasıyla yeterli). Yalnızca CPU
# kullanacaksanız "int8" yapın — CPU'da float16 çok yavaştır.
whisper_compute_type: "float16"

# Whisper'ın çalışacağı cihaz: "cuda" (GPU) veya "cpu". "auto" YAZMAYIN —
# faster-whisper'ın kendi varsayılanı odur ve CUDA kütüphaneleri yokken
# model yüklenirken değil İLK TANIMA sırasında çöker.
# GPU için CUDA Toolkit'in tamamı GEREKMEZ, pip yeterlidir:
#     pip install nvidia-cublas-cu12 nvidia-cudnn-cu12
# Kütüphaneler bulunamazsa Artemis sessizce CPU'ya düşer ve büyük modeli
# küçüğüyle değiştirir (bkz. voice/gpu.py, voice/stt.py).
whisper_device: "cuda"

# Piper Türkçe ses modelinin (.onnx) yolu. Yanında aynı adı taşıyan bir
# .onnx.json dosyası da bulunmalıdır (Piper bunu şart koşar). Belirtilmezse
# repo kökündeki voice_models/tr_TR-dfki-medium.onnx kullanılır (kurmak
# için: python scripts/setup_voice.py). Farklı bir yere koyduysanız:
# piper_model_path: "C:/yol/tr_TR-dfki-medium.onnx"

# Komut dinlerken kullanıcı sustuktan sonra kaydın kaç saniye beklenip
# sonlandırılacağı. Kısa tutmak tepkiyi hızlandırır ama cümle arasında
# duraklayan kullanıcıları yarıda kesebilir.
silence_timeout_seconds: 1.2

# Tek bir komut kaydı için üst sınır (saniye) — kullanıcı hiç susmasa
# bile kayıt bu süre sonunda zorla kesilir (sonsuz dinlemeyi önleyen
# güvenlik sınırı).
max_command_seconds: 12.0

# Artemis'i elle uyandıran, sistem genelinde çalışan kısayol.
# `wake_word_enabled: false` yaptıysanız Artemis'i çağırmanın tek yolu
# budur (tepsi simgesindeki "Şimdi dinle" dışında). Kısayolu başka bir
# uygulama kullanıyorsa Artemis kısayolsuz çalışmaya devam eder.
# Biçim: değiştiriciler + tek tuş, artı ile ayrılır (ctrl/alt/shift/win).
voice_hotkey: "ctrl+alt+a"

# Uyandırma sözcüğü için kullanılan Whisper model boyutu. Komut tanımadan
# AYRI ve kasıtlı olarak küçük tutulur ("tiny"): uyandırma algılaması çok
# daha sık çalışır, bu yüzden ucuz olmalı. Komut tanımada doğruluk kritik
# olduğundan orada whisper_model_size (yukarıda, large-v3-turbo)
# geçerlidir (bkz. voice/wake_word.py).
wake_word_model_size: "tiny"

# --- Hibrit (bulut/yerel) ses ayarları ---
# İnternet varken bulut sağlayıcılar (Groq STT, Microsoft Edge TTS) belirgin
# biçimde daha doğru sonuç verir — özellikle yabancı özel isimlerde (Discord,
# Riot Client gibi). İnternet yokken ya da bulut bir hata verirse otomatik
# olarak yukarıdaki yerel modellere (faster-whisper/Piper) düşülür; asistan
# bu durumda da çalışmaya devam eder (bkz. voice/router.py).

# Konuşma tanımanın nereden yapılacağı: "auto" (varsayılan — önce bulut,
# hata/internet yoksa otomatik yerele düşer), "cloud" (yalnızca bulut;
# başarısız olursa dürüstçe hata verir), "local" (yalnızca yerel — ses
# HİÇBİR yere gönderilmez).
stt_provider: "auto"

# Sesli okumanın nereden yapılacağı; stt_provider ile aynı üç değeri alır.
# "local" seçilirse cevap metni de dışarı çıkmaz.
tts_provider: "auto"

# Bulut konuşma tanımada hangi servis kullanılacak: "azure" veya "groq".
# Azure varsayılandır: Türkçesi güçlü ve ücretsiz kotası çok daha cömert
# (ayda 5 saat; Groq'un kotası daha dardır). Seçilen servisin anahtarı
# yoksa asistan BOZULMAZ — sessizce yerel Whisper'a düşer, yalnızca
# doğruluk etkilenir.
# NOT: Azure'un REST arayüzü ifade önceliklendirme (phrase list)
# DESTEKLEMEZ; "League of Legends" gibi özel isimleri ayrıca öne çıkarmak
# mümkün değil (o özellik yalnızca ağır Speech SDK'sında var). Groq ise
# `prompt` üzerinden ipucu kabul eder. Hangisinin sizin sesinizde daha iyi
# olduğunu deneyerek görün.
stt_cloud_provider: "azure"

# `stt_cloud_provider: "groq"` iken kullanılacak model. API anahtarı BU
# DOSYADAN GELMEZ, aşağıdaki güvenlik notuna bakın.
groq_model: "whisper-large-v3-turbo"

# Microsoft Edge TTS ses adı. Türkçe seçenekler:
# "tr-TR-EmelNeural" (kadın), "tr-TR-AhmetNeural" (erkek).
edge_tts_voice: "tr-TR-EmelNeural"

# Konuşma hızı (yüzde kayması). Nöral sesler fazla hızlı/düz okuduğu için
# robotik algılanır; ses çok robotik geliyorsa "-10%" gibi bir değer
# deneyin, belirgin fark yaratır. Masaüstünüzdeki artemis_ses_ornekleri
# klasöründe Emel/Ahmet için normal/yavaş karşılaştırmalı örnekler var.
edge_tts_rate: "+0%"

# Ses perdesi kayması. rate ile aynı mantık: "-10Hz" gibi daha pes bir
# değer denenebilir (karşılaştırmalı örnekler için yukarıdaki nota bakın).
edge_tts_pitch: "+0Hz"

# Bulut çağrılarının zaman aşımı (saniye).
cloud_timeout_seconds: 15.0

# Bir bulut hatasından sonra bulutun atlanacağı süre (saniye). Bu olmasa,
# internet tamamen kapalıyken her komut önce buluta gidip zaman aşımını
# beklerdi ve asistan kullanılamaz hale gelirdi (bkz. voice/router.py).
cloud_failure_cooldown_seconds: 60.0

# GÜVENLİK: Bu depo HERKESE AÇIKTIR ve config.yaml git ile İZLENİR — API
# anahtarlarını KESİNLİKLE buraya yazmayın, ilk commit'te sızmış olur.
# Anahtarlar yalnızca şu üç kaynaktan, bu sırayla okunur:
#   1. Ortam değişkeni (önerilen):
#        GROQ_API_KEY
#        AZURE_SPEECH_KEY + AZURE_SPEECH_REGION
#   2. config/secrets.yaml dosyası (.gitignore'dadır, asla commit edilmez):
#        groq_api_key / azure_speech_key / azure_speech_region
#   3. Windows kayıt defteri — `setx` ile kaydedilmiş ama zaten açık olan
#      terminale yansımamış değerleri de bulabilmek için son çare.
# Bkz. config/settings.py::get_groq_api_key, get_azure_speech_credentials.
